<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora IVOMEC Pitbull</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;

    background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.65)),
    url('https://i.postimg.cc/XqXV9WxX/d6a099c5-62d4-4a29-a095-bd602a7580ab.png');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

.container{
    width:100%;
    max-width:500px;

    background:rgba(15,15,15,.88);
    backdrop-filter:blur(12px);

    border-radius:24px;
    padding:35px;

    border:1px solid rgba(255,255,255,.1);

    box-shadow:
    0 10px 40px rgba(0,0,0,.5);

    color:#fff;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    font-size:2rem;
    color:#ff5722;
    font-weight:900;
    letter-spacing:1px;
}

.logo p{
    margin-top:8px;
    color:#cfcfcf;
}

label{
    font-size:16px;
    display:block;
    margin-bottom:10px;
    font-weight:600;
}

input{
    width:100%;
    height:55px;
    padding:15px;

    border:none;
    outline:none;

    background:#222;
    color:#fff;

    border-radius:12px;

    font-size:18px;
}

input:focus{
    border:2px solid #ff5722;
}

button{
    width:100%;
    height:55px;

    margin-top:20px;

    border:none;
    border-radius:12px;

    background:#ff5722;
    color:#fff;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;

    transition:.3s;
}

button:hover{
    background:#ff6d3a;
    transform:translateY(-2px);
}

.resultado{
    margin-top:25px;

    background:#1e1e1e;

    border-left:5px solid #4CAF50;

    border-radius:15px;
    padding:20px;

    text-align:center;

    display:none;

    animation:fade .4s ease;
}

.resultado h2{
    color:#4CAF50;
    margin-bottom:15px;
}

.valor{
    font-size:1.8rem;
    font-weight:800;
    line-height:1.6;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* CELULARES */
@media(max-width:600px){

    .container{
        padding:25px;
    }

    .logo h1{
        font-size:1.6rem;
    }

    .valor{
        font-size:1.4rem;
    }

    input,
    button{
        height:52px;
        font-size:16px;
    }
}

/* TELAS GRANDES */
@media(min-width:1200px){

    .container{
        max-width:550px;
    }

    .logo h1{
        font-size:2.3rem;
    }
}

</style>
</head>
<body>

<div class="container">

    <div class="logo">
        <h1>🐾 IVOMEC INJETÁVEL</h1>
        <p>Calculadora de Dosagem por Peso</p>
    </div>

    <label>Peso do cão (kg)</label>

    <input
        type="number"
        id="peso"
        placeholder="Ex: 25"
    >

    <button onclick="calcular()">
        CALCULAR DOSAGEM
    </button>

    <div class="resultado" id="resultado">
        <h2>Resultado</h2>

        <div class="valor" id="valor"></div>
    </div>

</div>

<script>

function calcular(){

    let peso = parseFloat(
        document.getElementById("peso").value
    );

    if(isNaN(peso) || peso <= 0){
        alert("Digite um peso válido.");
        return;
    }

    // 1 ml para cada 50 kg
    let dose = peso / 50;

    document.getElementById("valor").innerHTML =
        "🐶 Peso: <b>" + peso.toFixed(1) + " kg</b><br><br>" +
        "💉 Dose: <b>" + dose.toFixed(2) + " ml</b>";

    document.getElementById("resultado").style.display = "block";
}

</script>

</body>
</html>
